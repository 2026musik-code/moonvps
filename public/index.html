<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXUS AI</title>
    <script src="https://js.puter.com/v2/"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="background-animation"></div>

    <!-- Sidebar / Navigation -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button id="new-chat-btn" class="new-chat-btn">
                <i class="fa-solid fa-plus"></i> New Chat
            </button>
            <button id="close-sidebar" class="icon-btn mobile-only">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="chat-history" id="chat-history">
            <!-- Chat history items will be injected here -->
        </div>
    </div>

    <!-- Overlay for mobile sidebar -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="container">
        <header>
            <div class="header-left">
                <button id="menu-btn" class="icon-btn">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="logo">
                    <i class="fa-solid fa-atom fa-spin-pulse"></i>
                    <span>NEXUS AI</span>
                </div>
            </div>
            <div class="model-selector">
                <select id="model-select">
                    <option value="claude-haiku-4-5">Claude Haiku 4.5</option>
                    <option value="claude-opus-4-6">Claude Opus 4.6</option>
                </select>
            </div>
        </header>

        <main id="chat-container">
            <div class="welcome-message">
                <h1>Welcome to NEXUS</h1>
                <p>Advanced AI Interaction Interface</p>
            </div>
        </main>

        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="user-input" placeholder="Initiate sequence..." rows="1"></textarea>
                <button id="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
