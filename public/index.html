<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXUS AI</title>
    <script src="https://js.puter.com/v2/"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="background-animation"></div>

    <!-- Login Overlay -->
    <div class="login-overlay" id="login-overlay">
        <div class="login-box">
            <div class="login-logo">
                <i class="fa-solid fa-atom fa-spin-pulse"></i>
                <span>NEXUS AI</span>
            </div>
            <h3>Authentication Required</h3>
            <input type="password" id="login-key" class="login-input" placeholder="Enter Access Key or Admin Password">
            <button id="login-btn" class="login-btn">ENTER SYSTEM</button>
            <p id="login-error" class="error-msg"></p>
        </div>
    </div>

    <!-- Admin Panel Overlay -->
    <div class="admin-overlay" id="admin-panel" style="display: none;">
        <div class="admin-content">
            <div class="admin-header">
                <h3><i class="fa-solid fa-shield-halved"></i> Admin Console</h3>
                <button id="close-admin-btn" class="icon-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="admin-body">
                <!-- Change Password -->
                <div class="admin-section">
                    <h4>Change Admin Password</h4>
                    <div class="input-row">
                        <input type="password" id="admin-new-pass" class="admin-input" placeholder="New Password">
                        <button id="admin-update-pass-btn" class="sidebar-btn outline">Update</button>
                    </div>
                </div>

                <!-- Create Key -->
                <div class="admin-section">
                    <h4>Create User Key</h4>
                    <div class="input-row">
                        <input type="text" id="new-key-name" class="admin-input" placeholder="Key Name">
                        <input type="number" id="new-key-quota" class="admin-input" placeholder="Quota (e.g. 100)">
                        <button id="create-key-btn" class="sidebar-btn outline">Create</button>
                    </div>
                </div>

                <!-- Manage Keys -->
                <div class="admin-section">
                    <h4>Manage Keys</h4>
                    <div class="keys-table-wrapper">
                        <table id="keys-table">
                            <thead>
                                <tr>
                                    <th>Key</th>
                                    <th>Used / Quota</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Keys injected here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Sidebar / Navigation -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button id="new-chat-btn" class="new-chat-btn">
                <i class="fa-solid fa-plus"></i> New Chat
            </button>
            <button id="close-sidebar" class="icon-btn mobile-only">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- User Stats (Quota) -->
        <div class="sidebar-section" id="user-stats-section" style="display: none;">
            <h3 class="sidebar-title"><i class="fa-solid fa-chart-pie"></i> Usage Stats</h3>
            <div class="stats-box">
                <div class="stat-item">
                    <span>Key:</span> <span id="display-key-name">...</span>
                </div>
                <div class="stat-item">
                    <span>Quota:</span> <span id="display-quota">0/0</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="quota-progress" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <div class="sidebar-section">
            <h3 class="sidebar-title"><i class="fa-brands fa-github"></i> GitHub</h3>

            <div id="github-login-form">
                <input type="text" id="gh-username-input" class="sidebar-input" placeholder="Username">
                <input type="password" id="gh-token-input" class="sidebar-input" placeholder="Personal Access Token">
                <button id="github-save-btn" class="sidebar-btn outline">
                    Connect
                </button>
            </div>

            <div id="github-repo-container" style="display: none;">
                <div class="user-info">
                    <img id="gh-avatar" src="" alt="Avatar">
                    <span id="gh-username-display">User</span>
                </div>
                <select id="repo-select" class="sidebar-select">
                    <option value="">Select Repository...</option>
                </select>
                <button id="github-disconnect-btn" class="text-btn">Disconnect</button>
            </div>
        </div>

        <!-- Admin Entry -->
        <div class="sidebar-section" id="admin-entry-section" style="display: none;">
             <button id="open-admin-btn" class="sidebar-btn outline" style="border-color: #ff0055; color: #ff0055;">
                <i class="fa-solid fa-lock"></i> Admin Panel
            </button>
        </div>

        <div class="chat-history-header">History</div>
        <div class="chat-history" id="chat-history">
            <!-- Chat history items will be injected here -->
        </div>
    </div>

    <!-- Overlay for mobile sidebar -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- GitHub Commit Modal -->
    <div class="modal-overlay" id="commit-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fa-brands fa-github"></i> Save to Repository</h3>
                <button id="close-modal-btn" class="icon-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <label>Repository</label>
                    <input type="text" id="commit-repo" class="modal-input" disabled>
                </div>
                <div class="input-group">
                    <label>File Path (e.g., src/main.js)</label>
                    <input type="text" id="commit-path" class="modal-input" placeholder="path/to/file.ext">
                </div>
                <div class="input-group">
                    <label>Commit Message</label>
                    <input type="text" id="commit-message" class="modal-input" placeholder="Update file">
                </div>
                <div class="code-preview" id="commit-preview"></div>
                <div class="modal-actions">
                    <button id="commit-cancel-btn" class="sidebar-btn outline">Cancel</button>
                    <button id="commit-confirm-btn" class="new-chat-btn">Commit Changes</button>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <header>
            <div class="header-left">
                <button id="menu-btn" class="icon-btn">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="logo">
                    <i class="fa-solid fa-atom fa-spin-pulse"></i>
                    <span>NEXUS AI</span>
                </div>
            </div>
            <div class="model-selector">
                <select id="model-select">
                    <option value="claude-haiku-4-5">Claude Haiku 4.5</option>
                    <option value="claude-opus-4-6">Claude Opus 4.6</option>
                    <option value="gemini-3-flash-preview">Gemini 3 Flash</option>
                    <option value="gemini-3-pro-preview">Gemini 3 Pro</option>
                    <option value="gemini-3-pro-image-preview">Gemini 3 Image Gen</option>
                    <option value="gemini-2.5-flash-image-preview">Gemini 2.5 Flash Image Gen</option>
                    <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
                    <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
                </select>
            </div>
        </header>

        <main id="chat-container">
            <div class="welcome-message">
                <h1>Welcome to NEXUS</h1>
                <p>Advanced AI Interaction Interface</p>
            </div>
        </main>

        <div class="input-area">
            <div class="image-preview-container" id="image-preview-container" style="display: none;">
                <img id="image-preview" src="" alt="Preview">
                <button id="remove-image-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="input-wrapper">
                <input type="file" id="image-input" accept="image/*" style="display: none;">
                <button id="attach-btn" class="icon-btn" title="Attach Image"><i class="fa-regular fa-image"></i></button>
                <textarea id="user-input" placeholder="Initiate sequence... (Ctrl+Enter to send)" rows="1"></textarea>
                <button id="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
